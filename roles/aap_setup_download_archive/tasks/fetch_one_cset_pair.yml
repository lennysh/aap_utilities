---
- name: Build cset API URL for this AAP x RHEL pair
  ansible.builtin.set_fact:
    __aap_setup_down_images_cset_base: >-
      https://api.access.redhat.com/management/v1/images/cset/ansible-automation-platform-{{ aap_version_item }}-for-rhel-{{ aap_rhel_version_item }}-{{ aap_setup_arch }}-files

- name: List cset images (single request, limit only)
  no_log: "{{ aap_setup_down_no_log | default(true) | bool }}"
  ansible.builtin.uri:
    url: "{{ __aap_setup_down_images_cset_base }}?limit={{ [aap_setup_down_all_page_limit | int, 100] | min }}"
    method: GET
    return_content: true
    status_code: [200, 404]
    headers:
      Authorization: Bearer {{ __aap_rh_access_token }}
  register: __aap_cset_page

- name: Note missing cset for this AAP/RHEL pair
  ansible.builtin.debug:
    msg: >-
      No content set for AAP {{ aap_version_item }} on RHEL {{ aap_rhel_version_item }} (HTTP 404); skipping.
    verbosity: 1
  when: __aap_cset_page.status | default(200) | int == 404

- name: Append tagged cset rows to aggregated list
  ansible.builtin.set_fact:
    __aap_cset_raw_list: "{{ (__aap_cset_raw_list | default([])) + ((__aap_cset_page.json.body | default([])) | map('combine', {'_aap_src_version': aap_version_item, '_aap_src_rhel': aap_rhel_version_item}) | list) }}"
  when: __aap_cset_page.status | default(200) | int != 404
