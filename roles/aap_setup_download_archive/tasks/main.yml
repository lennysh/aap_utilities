---
# tasks file for aap_setup_download_archive
- name: Login to Red Hat APIs
  no_log: "{{ aap_setup_down_no_log | default(true) | bool }}"
  ansible.builtin.uri:
    url: "{{ aap_setup_down_token_url }}"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: refresh_token
      client_id: rhsm-api
      refresh_token: "{{ aap_setup_down_offline_token }}"
  register: __aap_setup_down_login

- name: Record wall time after initial login
  ansible.builtin.command: date +%s
  changed_when: false
  register: __aap_epoch_after_login

- name: Initialize OAuth access token facts (refresh before expires_in during long syncs)
  ansible.builtin.set_fact:
    __aap_rh_access_token: "{{ __aap_setup_down_login.json.access_token }}"
    __aap_rh_access_token_expires_at_epoch: "{{ (__aap_epoch_after_login.stdout | int) + (__aap_setup_down_login.json.expires_in | default(900) | int) }}"

- name: Ensure destination directory exists
  ansible.builtin.file:
    path: "{{ aap_setup_down_dest_dir }}"
    state: directory
    mode: "0755"

- name: Resolve AAP version list
  ansible.builtin.set_fact:
    __aap_setup_down_versions: >-
      {{
        [aap_setup_down_version]
        if (aap_setup_down_version is defined)
        else (
          [aap_setup_down_versions]
          if (aap_setup_down_versions is string)
          else (aap_setup_down_versions | default(['2.6']))
        )
      }}

- name: Resolve RHEL version list
  ansible.builtin.set_fact:
    __aap_setup_rhel_versions: >-
      {{
        [aap_setup_rhel_version]
        if (aap_setup_rhel_version is defined)
        else (
          [aap_setup_rhel_versions]
          if (aap_setup_rhel_versions is string)
          else (aap_setup_rhel_versions | default(['10']))
        )
      }}

- name: Initialize checksum cache in memory
  ansible.builtin.set_fact:
    __aap_checksum_cache: {}

- name: Stat checksum cache file
  ansible.builtin.stat:
    path: "{{ aap_setup_down_checksum_cache_file }}"
  register: __aap_ck_cache_file_stat
  when: aap_setup_down_checksum_cache_enabled | bool

- name: Load checksum cache from disk
  ansible.builtin.slurp:
    path: "{{ aap_setup_down_checksum_cache_file }}"
  register: __aap_ck_cache_slurp
  when:
    - aap_setup_down_checksum_cache_enabled | bool
    - __aap_ck_cache_file_stat.stat.exists | default(false)

- name: Merge loaded checksum cache
  ansible.builtin.set_fact:
    __aap_checksum_cache: "{{ __aap_ck_cache_slurp.content | b64decode | from_json }}"
  when:
    - aap_setup_down_checksum_cache_enabled | bool
    - __aap_ck_cache_slurp is defined
    - __aap_ck_cache_slurp.content is defined

- name: Initialize archive file path list
  ansible.builtin.set_fact:
    aap_setup_down_archive_files: []

- name: Download cset files (aggregate, dedupe, minimal sync loop)
  block:
    - name: Reconcile checksum cache with disk (drop missing files; touch timestamps)
      lennysh.aap_utilities.aap_setup_checksum_cache_reconcile:
        dest_dir: "{{ aap_setup_down_dest_dir }}"
        cache: "{{ __aap_checksum_cache }}"
        touch_from_date_published: "{{ aap_setup_down_set_file_times_from_api | bool }}"
      register: __aap_reconcile
      when: aap_setup_down_checksum_cache_enabled | bool

    - name: Apply reconciled checksum cache
      ansible.builtin.set_fact:
        __aap_checksum_cache: "{{ __aap_reconcile.cache }}"
      when: aap_setup_down_checksum_cache_enabled | bool

    - name: Fetch all cset API listings (AAP x RHEL)
      ansible.builtin.include_tasks: fetch_all_csets.yml

    - name: Deduplicate cset rows by filename and checksum
      lennysh.aap_utilities.cset_manifest_dedupe:
        cset_rows: "{{ __aap_cset_raw_list }}"
      register: __aap_dedupe

    - name: Record deduplicated manifest and warnings
      ansible.builtin.set_fact:
        __deduped_cset_list: "{{ __aap_dedupe.deduped | default([]) }}"
        __aap_dedupe_warnings: "{{ __aap_dedupe.dedupe_warnings | default([]) }}"

    - name: Report cset filename / checksum collisions
      ansible.builtin.debug:
        msg: "{{ __aap_dedupe_warnings }}"
      when: __aap_dedupe_warnings | length > 0

    - name: Merge AAP/RHEL version lists from manifest into checksum cache
      lennysh.aap_utilities.aap_setup_checksum_cache_merge_manifest:
        cache: "{{ __aap_checksum_cache }}"
        manifest: "{{ __deduped_cset_list }}"
      register: __aap_cache_merge
      when: aap_setup_down_checksum_cache_enabled | bool

    - name: Apply merged checksum cache after manifest merge
      ansible.builtin.set_fact:
        __aap_checksum_cache: "{{ __aap_cache_merge.cache }}"
      when:
        - aap_setup_down_checksum_cache_enabled | bool
        - __aap_cache_merge is defined
        - __aap_cache_merge.cache is defined

    - name: Build work queue (cache-aware)
      lennysh.aap_utilities.cset_download_work_queue:
        dest_dir: "{{ aap_setup_down_dest_dir }}"
        cache: "{{ __aap_checksum_cache }}"
        manifest: "{{ __deduped_cset_list }}"
        checksum_cache_enabled: true
      register: __aap_workq
      when: aap_setup_down_checksum_cache_enabled | bool

    - name: Parse work queue from module
      ansible.builtin.set_fact:
        __aap_work_queue: "{{ __aap_workq.work_queue | default([]) }}"
      when: aap_setup_down_checksum_cache_enabled | bool

    - name: Work queue is entire manifest when checksum cache is disabled
      ansible.builtin.set_fact:
        __aap_work_queue: "{{ __deduped_cset_list }}"
      when: not (aap_setup_down_checksum_cache_enabled | bool)

    - name: Set archive file paths fact (full deduplicated set)
      ansible.builtin.set_fact:
        aap_setup_down_archive_files: "{{ __deduped_cset_list | map(attribute='filename') | map('regex_replace', '^', aap_setup_down_dest_dir ~ '/') | list }}"

    - name: Sync cset files that still need download or verification
      ansible.builtin.include_tasks: sync_one_cset_file.yml
      loop: "{{ __aap_work_queue }}"
      loop_control:
        loop_var: cset_file
        label: "{{ cset_file.filename }}"

  always:
    - name: Persist checksum cache to disk
      ansible.builtin.copy:
        dest: "{{ aap_setup_down_checksum_cache_file }}"
        content: "{{ __aap_checksum_cache | default({}) | to_nice_json }}\n"
        mode: "0600"
      when: aap_setup_down_checksum_cache_enabled | bool

    - name: Record timestamp for inventory markdown
      ansible.builtin.command: date -Iseconds
      changed_when: false
      register: __aap_inventory_ts
      when:
        - aap_setup_down_checksum_cache_enabled | bool
        - aap_setup_down_inventory_markdown_enabled | bool

    - name: Write AAP setup download inventory markdown
      ansible.builtin.template:
        src: aap_setup_download_inventory.md.j2
        dest: "{{ aap_setup_down_inventory_markdown_file }}"
        mode: "0644"
      when:
        - aap_setup_down_checksum_cache_enabled | bool
        - aap_setup_down_inventory_markdown_enabled | bool
