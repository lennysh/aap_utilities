---
- name: Set destination directory
  ansible.builtin.set_fact:
    __aap_setup_down_dest_dir: "{{ aap_setup_down_dest_dir }}"

- name: Ensure destination directory exists
  ansible.builtin.file:
    path: "{{ __aap_setup_down_dest_dir }}"
    state: directory
    owner: "{{ aap_setup_down_owner | default(omit) }}"
    group: "{{ aap_setup_down_group | default(omit) }}"
    mode: "{{ aap_setup_down_dir_mode }}"

- name: Set local file path for this cset entry
  ansible.builtin.set_fact:
    __aap_local_path: "{{ __aap_setup_down_dest_dir }}/{{ cset_file.filename }}"

- name: Derive AAP and RHEL version lists from cset _sources
  ansible.builtin.set_fact:
    __cset_aap_versions: "{{ cset_file._sources | default([]) | map('first') | map('string') | reject('equalto', '') | unique | lennysh.aap_utilities.aap_version_sort }}"
    __cset_rhel_versions: "{{ cset_file._sources | default([]) | map('last') | map('string') | reject('equalto', '') | unique | lennysh.aap_utilities.aap_version_sort }}"

- name: Quick stat (metadata only; checksum stat is slow on large tarballs)
  ansible.builtin.stat:
    path: "{{ __aap_local_path }}"
    get_checksum: false
  register: __aap_cset_quick_stat

- name: Decide whether full SHA-256 stat is required
  ansible.builtin.set_fact:
    __aap_need_checksum_stat: >-
      {{
        (__aap_cset_quick_stat.stat.exists | default(false)) and (
          (not (aap_setup_down_checksum_cache_enabled | bool)) or
          (cset_file.filename not in __aap_checksum_cache) or
          ((__aap_checksum_cache[cset_file.filename].sha256 | default('')) | length == 0) or
          ((__aap_checksum_cache[cset_file.filename].size | default(-1) | int)
           != (__aap_cset_quick_stat.stat.size | default(-2) | int))
        )
      }}

- name: Stat existing file for SHA-256 comparison (full checksum)
  ansible.builtin.stat:
    path: "{{ __aap_local_path }}"
    checksum_algorithm: sha256
    get_checksum: true
  register: __aap_cset_full_stat
  when: __aap_need_checksum_stat | bool

- name: Store computed checksum in memory cache
  ansible.builtin.set_fact:
    __aap_checksum_cache: "{{ __aap_checksum_cache | combine({cset_file.filename: {'sha256': (__aap_cset_full_stat.stat.checksum | lower), 'size': (__aap_cset_full_stat.stat.size | int), 'date_published': (cset_file.datePublished | default('')), 'image_name': (cset_file.imageName | default('')), 'aap_versions': ((((__aap_checksum_cache[cset_file.filename] | default({})).aap_versions | default([])) + __cset_aap_versions) | unique | lennysh.aap_utilities.aap_version_sort), 'rhel_versions': ((((__aap_checksum_cache[cset_file.filename] | default({})).rhel_versions | default([])) + __cset_rhel_versions) | unique | lennysh.aap_utilities.aap_version_sort)}}, recursive=True) }}"
  when:
    - aap_setup_down_checksum_cache_enabled | bool
    - __aap_need_checksum_stat | bool
    - __aap_cset_full_stat is defined
    - not (__aap_cset_full_stat.skipped | default(false))
    - __aap_cset_full_stat.stat.exists | default(false)
    - __aap_cset_full_stat.stat.checksum is defined

- name: Resolve local SHA-256 for download comparison
  ansible.builtin.set_fact:
    __aap_local_sha256: >-
      {{
        '' if not (__aap_cset_quick_stat.stat.exists | default(false))
        else (
          (__aap_cset_full_stat.stat.checksum | default('', true) | lower)
          if (__aap_need_checksum_stat | bool)
          else (__aap_checksum_cache[cset_file.filename].sha256 | default('') | lower)
        )
      }}

- name: Build local stat fact for get_url condition
  ansible.builtin.set_fact:
    __aap_cset_local_stat:
      stat:
        exists: "{{ __aap_cset_quick_stat.stat.exists | default(false) }}"
        checksum: "{{ __aap_local_sha256 }}"

- name: Current epoch for access token expiry check
  ansible.builtin.command: date +%s
  changed_when: false
  register: __aap_now_epoch_cmd

- name: Refresh Red Hat access token when near expiry
  ansible.builtin.include_tasks: refresh_rh_access_token.yml
  when: >
    (__aap_now_epoch_cmd.stdout | int) >=
    ((__aap_rh_access_token_expires_at_epoch | int)
    - (aap_setup_down_token_refresh_skew_seconds | default(120) | int))

- name: "Download cset file when missing or checksum mismatch to: {{ __aap_local_path | basename }}"
  no_log: "{{ aap_setup_down_no_log | default(true) | bool }}"
  ansible.builtin.get_url:
    url: "{{ cset_file.downloadHref }}"
    dest: "{{ __aap_local_path }}"
    owner: "{{ aap_setup_down_owner | default(omit) }}"
    group: "{{ aap_setup_down_group | default(omit) }}"
    mode: "{{ aap_setup_down_file_mode }}"
    checksum: "sha256:{{ cset_file.checksum }}"
    headers:
      Authorization: Bearer {{ __aap_rh_access_token }}
  register: __aap_cset_get_url
  when: >
    not __aap_cset_local_stat.stat.exists | default(false) or
    (__aap_cset_local_stat.stat.checksum | default('', true) | lower)
    != (cset_file.checksum | lower)

- name: Stat file after download (size for cache and download notifications)
  ansible.builtin.stat:
    path: "{{ __aap_local_path }}"
    get_checksum: false
  register: __aap_cset_post_dl_stat
  when:
    - __aap_cset_get_url is defined
    - not (__aap_cset_get_url.skipped | default(false))
    - __aap_cset_get_url.changed | default(false)

- name: Record artifact downloaded this run
  ansible.builtin.set_fact:
    __aap_downloaded_this_run: "{{ (__aap_downloaded_this_run | default([])) + [{'filename': cset_file.filename, 'path': __aap_local_path, 'image_name': (cset_file.imageName | default('')), 'sha256': (cset_file.checksum | lower), 'date_published': (cset_file.datePublished | default('')), 'size': (__aap_cset_post_dl_stat.stat.size | int), 'aap_versions': __cset_aap_versions, 'rhel_versions': __cset_rhel_versions}] }}"
  when:
    - not ansible_check_mode
    - __aap_cset_get_url is defined
    - not (__aap_cset_get_url.skipped | default(false))
    - __aap_cset_get_url.changed | default(false)
    - __aap_cset_post_dl_stat is defined
    - not (__aap_cset_post_dl_stat.skipped | default(false))
    - __aap_cset_post_dl_stat.stat.exists | default(false)

- name: Record API checksum in cache after successful download
  ansible.builtin.set_fact:
    __aap_checksum_cache: "{{ __aap_checksum_cache | combine({cset_file.filename: {'sha256': (cset_file.checksum | lower), 'size': (__aap_cset_post_dl_stat.stat.size | int), 'date_published': (cset_file.datePublished | default('')), 'image_name': (cset_file.imageName | default('')), 'aap_versions': ((((__aap_checksum_cache[cset_file.filename] | default({})).aap_versions | default([])) + __cset_aap_versions) | unique | lennysh.aap_utilities.aap_version_sort), 'rhel_versions': ((((__aap_checksum_cache[cset_file.filename] | default({})).rhel_versions | default([])) + __cset_rhel_versions) | unique | lennysh.aap_utilities.aap_version_sort)}}, recursive=True) }}"
  when:
    - aap_setup_down_checksum_cache_enabled | bool
    - __aap_cset_post_dl_stat is defined
    - not (__aap_cset_post_dl_stat.skipped | default(false))

- name: Backfill date_published in cache from API when entry predates this field
  ansible.builtin.set_fact:
    __aap_checksum_cache: "{{ __aap_checksum_cache | combine({cset_file.filename: (__aap_checksum_cache[cset_file.filename] | combine({'date_published': (cset_file.datePublished | default(''))}))}, recursive=True) }}"
  when:
    - aap_setup_down_checksum_cache_enabled | bool
    - cset_file.filename in __aap_checksum_cache
    - (cset_file.datePublished | default('') | string | length) > 0
    - (__aap_checksum_cache[cset_file.filename].date_published | default('') | string | length) == 0

- name: Backfill image_name in cache from API when entry predates this field
  ansible.builtin.set_fact:
    __aap_checksum_cache: "{{ __aap_checksum_cache | combine({cset_file.filename: (__aap_checksum_cache[cset_file.filename] | combine({'image_name': (cset_file.imageName | default(''))}))}, recursive=True) }}"
  when:
    - aap_setup_down_checksum_cache_enabled | bool
    - cset_file.filename in __aap_checksum_cache
    - (cset_file.imageName | default('') | string | length) > 0
    - (__aap_checksum_cache[cset_file.filename].image_name | default('') | string | length) == 0

- name: Confirm file exists before applying API timestamps
  ansible.builtin.stat:
    path: "{{ __aap_local_path }}"
    get_checksum: false
  register: __aap_for_touch_stat

- name: Set local file times from API datePublished
  ansible.builtin.command:
    argv:
      - touch
      - -d
      - "{{ cset_file.datePublished }}"
      - "{{ __aap_local_path }}"
  changed_when: false
  when:
    - aap_setup_down_set_file_times_from_api | bool
    - cset_file.datePublished is defined
    - (cset_file.datePublished | default('') | string | length) > 0
    - __aap_for_touch_stat.stat.exists | default(false)
