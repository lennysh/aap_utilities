---
- name: Obtain new Red Hat API access token
  no_log: "{{ aap_setup_down_no_log | default(true) | bool }}"
  ansible.builtin.uri:
    url: "{{ aap_setup_down_token_url }}"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: refresh_token
      client_id: rhsm-api
      refresh_token: "{{ aap_setup_down_offline_token }}"
  register: __aap_token_refresh

- name: Record wall time after token response
  ansible.builtin.command: date +%s
  changed_when: false
  register: __aap_epoch_after_token

- name: Update access token and expiry facts
  ansible.builtin.set_fact:
    __aap_rh_access_token: "{{ __aap_token_refresh.json.access_token }}"
    __aap_rh_access_token_expires_at_epoch: "{{ (__aap_epoch_after_token.stdout | int) + (__aap_token_refresh.json.expires_in | default(900) | int) }}"
